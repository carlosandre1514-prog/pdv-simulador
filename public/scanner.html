<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Código de Barras</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
      margin: 0;
    }
    h2 { color: #00e676; margin-bottom: 15px; }
    .qtd-box {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    label { font-weight: bold; font-size: 1.1rem; }
    input[type="number"] {
      width: 80px;
      padding: 8px;
      font-size: 1.2rem;
      text-align: center;
      border-radius: 6px;
      border: 2px solid #00e676;
      background: #1e1e1e;
      color: #fff;
    }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    #status { margin-top: 15px; font-size: 1.1rem; color: #bb86fc; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Leitor de Código de Barras</h2>

  <div class="qtd-box">
    <label for="qtdInput">Qtd:</label>
    <input type="number" id="qtdInput" value="1" min="1" max="999">
  </div>

  <div id="reader"></div>
  <div id="status">Aguardando câmera...</div>

  <script>
    const socket = io();
    let lendo = false;

    function onScanSuccess(decodedText) {
      if (lendo) return;
      lendo = true;

      const qtdInput = document.getElementById('qtdInput');
      let qtd = parseInt(qtdInput.value, 10) || 1;

      document.getElementById('status').innerText = `Lido (${qtd}x): ${decodedText}`;

      // Envia objeto com o código e a quantidade para o servidor
      socket.emit('barcode', {
        code: decodedText,
        quantity: qtd
      });

      // Reseta a quantidade de volta para 1 após a leitura
      qtdInput.value = 1;

      setTimeout(() => {
        lendo = false;
        document.getElementById('status').innerText = 'Aguardando próxima leitura...';
      }, 1500);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
